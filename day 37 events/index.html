<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHP Check-in Form</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #222; color: #fff; }
        form { max-width: 400px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; }
        button { padding: 10px; font-size: 16px; background: #4ecca3; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #3db892; }
        #d4result { padding: 15px; border-radius: 4px; font-size: 16px; background: #2a2a2a; display: inline-block; min-width: 300px; }
    </style>
</head>
<body>

    <h2>SHP Check-in Form</h2>
    
    <!-- The form ID matches document.querySelector('#d4form') -->
    <form id="d4form">
        <div class="form-group">
            <label for="d4name">Name:</label>
            <input type="text" id="d4name" placeholder="Enter your name">
        </div>
        
        <div class="form-group">
            <label for="d4sleep">Sleep (Hours):</label>
            <!-- type="number" step="0.1" allows for decimals parsed by parseFloat -->
            <input type="number" id="d4sleep" step="0.1" placeholder="e.g., 7.5">
        </div>
        
        <div class="form-group">
            <label for="d4water">Water (Glasses):</label>
            <input type="number" id="d4water" placeholder="e.g., 8">
        </div>
        
        <div class="form-group">
            <label for="d4steps">Steps:</label>
            <input type="number" id="d4steps" placeholder="e.g., 10000">
        </div>
        
        <button type="submit">Submit Check-in</button>
    </form>

    <!-- The result display area matches document.querySelector('#d4result') -->
    <div id="d4result">Fill out the form to see results.</div>

    <!-- Link to your JavaScript file -->
    <script src="events.js"></script>
</body>
</html>
